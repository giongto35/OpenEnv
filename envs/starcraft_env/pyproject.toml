[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-starcraft-env"
version = "0.1.0"
description = "StarCraft Brood War environment for OpenEnv via Wine/Xvfb"
requires-python = ">=3.10"
dependencies = [
    "openenv-core[core]>=0.2.1",
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "uvicorn[standard]>=0.24.0",
    "requests>=2.31.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
server = "starcraft_env.server.app:main"

[tool.setuptools]
packages = ["starcraft_env", "starcraft_env.server"]
package-dir = { "starcraft_env" = ".", "starcraft_env.server" = "server" }
